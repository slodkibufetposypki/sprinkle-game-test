<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprinkle Mix (preview)</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f7f5f2;
      font-family: ui-rounded, system-ui, -apple-system, sans-serif;
      color: #4a2a35;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }
    h2 {
      font-size: 15px;
      margin: 18px 0 8px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .item img {
      height: 64px;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4 / 3;
      margin-top: 8px;
      background: #fbfaf8;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Sprinkle Mix</h1>
  <div id="pieces"></div>
  <h2>Scattered like a shot</h2>
  <canvas id="mix"></canvas>

  <script src="../../js/sprinkle-mix.js"></script>
  <script>
    'use strict';
    const pieces = document.getElementById('pieces');
    for (const el of SPRINKLE_MIX) {
      const h = document.createElement('h2');
      h.textContent = el.id;
      pieces.appendChild(h);
      const row = document.createElement('div');
      row.className = 'row';
      for (const color of el.colors) {
        const item = document.createElement('div');
        item.className = 'item';
        const img = document.createElement('img');
        img.src = `${el.id}-${color}.svg`;
        img.alt = `${el.id} ${color}`;
        img.style.height = `${Math.max(24, el.h * 9)}px`;
        item.appendChild(img);
        item.append(color);
        row.appendChild(item);
      }
      pieces.appendChild(row);
    }

    // A burst of the mix, denser in the middle (like the reference photo).
    loadSprinkleArt('./', () => {
      const canvas = document.getElementById('mix');
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const cssW = canvas.clientWidth;
      const cssH = canvas.clientHeight;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      const ctx = canvas.getContext('2d');
      const unit = cssW / 220; // world units across the canvas
      buildSprinkleBitmaps(unit * dpr);
      ctx.setTransform(unit * dpr, 0, 0, unit * dpr, 0, 0);
      const W = cssW / unit;
      const H = cssH / unit;
      let big = 0;
      for (let i = 0; i < 650; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = Math.pow(Math.random(), 0.8) * Math.min(W, H) * 0.62;
        const p = pickSprinkle(big >= 5);
        if (p.el === 'heart-large') big++;
        p.x = W / 2 + Math.cos(a) * d * 1.25;
        p.y = H / 2 + Math.sin(a) * d;
        drawSprinklePiece(ctx, p);
      }
    });
  </script>
</body>
</html>
