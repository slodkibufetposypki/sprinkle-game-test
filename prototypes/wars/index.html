<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6ec3ff">
  <title>Sprinkle Wars (prototype)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="side" id="side0">
      <div class="avatar"><canvas></canvas></div>
      <div class="bar"><div class="fill"></div><span class="pct"></span></div>
    </div>
    <div id="rounds"></div>
    <div class="side right" id="side1">
      <div class="bar"><div class="fill"></div><span class="pct"></span></div>
      <div class="avatar"><canvas></canvas></div>
    </div>
  </div>

  <div id="banner"></div>
  <div id="weapons"></div>

  <div id="result" class="hidden">
    <div class="card">
      <h1 id="result-title"></h1>
      <p id="result-text"></p>
      <button id="again" type="button"></button>
    </div>
  </div>

  <div id="rotate"></div>

  <script src="../../js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/wars.js"></script>
</body>
</html>
